<html>
    <head>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
      <h3>This form will populate with information from your last submit.</h3>
      <form action="/index.html">
        <input aria-required="true" autocomplete="shipping given-name" name="firstName" placeholder="First name" value="Annie"
  type="text" />
        <input aria-required="true" autocomplete="shipping family-name" name="lastName" placeholder="Last name" value="Von Snuffles"
  type="text" /><br />
        <input aria-required="true" autocomplete="shipping address-line1" name="address1" placeholder="Address" value="123 Sesame
  Street" type="text" /><br />
        <input aria-required="false" autocomplete="shipping address-line2" name="address2" placeholder="Apt suite etc" type="text" /><br
   />
        <input aria-required="true" autocomplete="shipping address-level2" name="city" placeholder="City" value="Orlando" type="text" />
        <input aria-required="true" autocomplete="shipping address-level1" name="state" placeholder="State" value="FL" type="text" />
        <input aria-required="true" autocomplete="shipping postal-code" name="zipCode" placeholder="Zip Code" value="12345" type="text"
  /><br />
        <button type="submit">Submit</button>
      </form>
      <script>
        var form = document.querySelector('form');
        var inputs = form.querySelectorAll('input[name]');

        // On load: restore values from cookie
        var saved = document.cookie.split('; ').find(function(c) { return c.startsWith('formData='); });
        if (saved) {
          var data = JSON.parse(decodeURIComponent(saved.split('=').slice(1).join('=')));
          inputs.forEach(function(input) {
            if (data[input.name] !== undefined) {
              input.value = data[input.name];
            }
          });
        }

        // On submit: save values to cookie before navigating
        form.addEventListener('submit', function() {
          var data = {};
          inputs.forEach(function(input) {
            data[input.name] = input.value;
          });
          document.cookie = 'formData=' + encodeURIComponent(JSON.stringify(data)) + '; path=/; max-age=31536000';
        });
      </script>
    </body>
  </html>
